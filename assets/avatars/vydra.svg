<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="20" fill="#193e32"/>
  <!-- Vydra / Otter -->
  <!-- Water wave ripples underneath -->
  <path d="M12 52 Q22 47 32 52 T52 52" stroke="#68a090" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Ears -->
  <circle cx="21" cy="23" r="4" fill="#6d4c33"/>
  <circle cx="43" cy="23" r="4" fill="#6d4c33"/>
  <!-- Head -->
  <ellipse cx="32" cy="31" rx="14" ry="12" fill="#885e3f"/>
  <!-- Muzzle -->
  <ellipse cx="32" cy="35" rx="8" ry="6" fill="#f7f9ed"/>
  <path d="M29 34 Q32 32 35 34 Q32 37 29 34 Z" fill="#193e32"/>
  <!-- Eyes -->
  <circle cx="26" cy="29" r="2" fill="#193e32"/>
  <circle cx="38" cy="29" r="2" fill="#193e32"/>
  <!-- Whiskers -->
  <line x1="24" y1="35" x2="16" y2="34" stroke="#d8e99e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="37" x2="17" y2="38" stroke="#d8e99e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="35" x2="48" y2="34" stroke="#d8e99e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="37" x2="47" y2="38" stroke="#d8e99e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="32" cy="46" rx="11" ry="6" fill="#755034"/>
</svg>